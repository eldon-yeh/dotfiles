# ~/.tmux.conf
 
# ============================================
# ESSENTIAL SETTINGS
# ============================================
 
# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0
 
# Increase scrollback buffer
set -g history-limit 50000
 
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
 
# Enable mouse support
set -g mouse on
 
# Enable focus events for vim autoread
set -g focus-events on
 
# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
 
# Aggressive resize for multi-client
setw -g aggressive-resize on

set -g allow-rename off
set -g automatic-rename off

set-window-option -g mode-keys vi

# Open new windows and panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Tmux theme
# Options must be set before the plugin runs: it bakes them into window-status-format at load
set -g @catppuccin_window_text " #W#F"
set -g @catppuccin_window_current_text " #W#F"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line more pleasant.
set -g status-position top
set -g status-left ""
set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '

# Ensure that everything on the right side of the status line
# is included.
set -g status-right-length 100

# Plugins

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Stay on bottom
run '~/.tmux/plugins/tpm/tpm'
